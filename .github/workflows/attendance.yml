name: Attendance

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *' # Run at 10:30 AM GMT+7 every day

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python process_attendance_headless.py
        env:
          MISA_CLIENT_ID:        ${{ secrets.MISA_CLIENT_ID }}
          MISA_CLIENT_SECRET:    ${{ secrets.MISA_CLIENT_SECRET }}
          MISA_TIMESHEET_ID:     ${{ secrets.MISA_TIMESHEET_ID }}
          AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_REFRESH_TOKEN:   ${{ secrets.AZURE_REFRESH_TOKEN }}
          EMAIL_FROM:            ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:              ${{ secrets.EMAIL_TO }}
          EMAIL_CC:              ${{ secrets.EMAIL_CC }}